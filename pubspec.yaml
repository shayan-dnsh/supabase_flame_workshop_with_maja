name: supabase_flame_workshop_workspace
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

workspace:
  - packages/game
  - packages/manloram
  - packages/skeleton
  - packages/slides

dev_dependencies:
  melos: ^8.9.0

melos:
  scripts:
    analyze:
      run: flutter analyze .
      description: Analyze all packages from the workspace root.
    format:
      run: dart format --set-exit-if-changed .
      description: Verify that all Dart files are formatted.
    format:fix:
      run: dart format .
      description: Format all Dart files.
    game:
      run: melos exec --scope=game -- flutter run -d chrome
      description: Run the game in Chrome.
    manloram:
      run: melos exec --scope=manloram -- flutter run -d chrome
      description: Run ManLoram in Chrome.
    manloram:lan:
      run: packages/manloram/tool/serve_lan.sh
      description: Serve ManLoram to friends on the same network.
    skeleton:
      run: melos exec --scope=skeleton -- flutter run -d chrome
      description: Run the exercise skeleton in Chrome.
    slides:
      run: melos exec --scope=slides -- flutter run -d chrome
      description: Run the slide deck in Chrome.
    build:game:web:
      run: melos exec --scope=game -- flutter build web
      description: Build the game for the web.
    build:manloram:web:
      run: melos exec --scope=manloram -- flutter build web
      description: Build ManLoram for the web.
    build:skeleton:web:
      run: melos exec --scope=skeleton -- flutter build web
      description: Build the skeleton for the web.
    build:slides:web:
      run: melos exec --scope=slides -- flutter build web
      description: Build the slide deck for the web.
